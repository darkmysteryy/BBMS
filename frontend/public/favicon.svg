<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F7F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Blood Drop Gradient -->
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B4B" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>

    <!-- Drop Shadow for Central Element -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Tech Node Gradient -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F0F4F8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid for "System" Vibe -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.3">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Title & Subtitle -->
  <text x="400" y="520" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">BLOOD BANK</text>
  <text x="400" y="555" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="4">MANAGEMENT SYSTEM</text>

  <g transform="translate(0, -30)">
    <!-- Connection Lines (Data Flow) -->
    <path d="M 200 180 C 300 180 300 280 400 280" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />
    <path d="M 600 180 C 500 180 500 280 400 280" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />
    <path d="M 200 380 C 300 380 300 280 400 280" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />
    <path d="M 600 380 C 500 380 500 280 400 280" fill="none" stroke="#3B82F6" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />

    <!-- Tech Orbit Rings -->
    <circle cx="400" cy="280" r="140" fill="none" stroke="#94A3B8" stroke-width="2" opacity="0.4" />
    <circle cx="400" cy="280" r="160" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="10 15" opacity="0.5" />

    <!-- Moving Data Dots on the Orbit -->
    <circle cx="240" cy="280" r="4" fill="#EF4444" />
    <circle cx="560" cy="280" r="4" fill="#3B82F6" />
    <circle cx="400" cy="120" r="4" fill="#3B82F6" />
    <circle cx="400" cy="440" r="4" fill="#EF4444" />

    <!-- Nodes (The "Management" Modules) -->
    <!-- Node 1: Donors -->
    <g transform="translate(200, 180)">
      <circle cx="0" cy="0" r="45" fill="url(#nodeGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="4 2" opacity="0.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">DONORS</text>
    </g>

    <!-- Node 2: Hospitals -->
    <g transform="translate(600, 180)">
      <circle cx="0" cy="0" r="45" fill="url(#nodeGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 2" opacity="0.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">CLINICS</text>
    </g>

    <!-- Node 3: Inventory -->
    <g transform="translate(200, 380)">
      <circle cx="0" cy="0" r="45" fill="url(#nodeGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="4 2" opacity="0.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">STOCK</text>
    </g>

    <!-- Node 4: Reports -->
    <g transform="translate(600, 380)">
      <circle cx="0" cy="0" r="45" fill="url(#nodeGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#shadow)" />
      <circle cx="0" cy="0" r="35" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2" opacity="0.5" />
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1E293B" text-anchor="middle">DATA</text>
    </g>

    <!-- Central Blood Drop Element -->
    <g filter="url(#shadow)">
      <!-- Smooth Blood Drop Shape -->
      <path d="M 400 120 C 375 190 310 240 310 310 A 90 90 0 0 0 490 310 C 490 240 425 190 400 120 Z" fill="url(#bloodGrad)" />
      
      <!-- Inner Medical Cross -->
      <path d="M 390 290 h 20 v 20 h 20 v 20 h -20 v 20 h -20 v -20 h -20 v -20 h 20 z" fill="#FFFFFF" opacity="0.95" />
      
      <!-- Subtle highlight on the blood drop for depth -->
      <path d="M 400 135 C 385 195 330 240 330 300 A 70 70 0 0 0 350 345 C 325 320 340 250 400 135 Z" fill="#FFFFFF" opacity="0.15" />
    </g>
  </g>
</svg>
